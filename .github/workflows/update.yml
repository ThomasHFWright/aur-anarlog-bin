name: Propose stable release update
on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
  statuses: write
concurrency:
  group: propose-release
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 15
    steps:
      - name: Install release tools
        run: pacman -Syu --noconfirm --needed git python github-cli
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Resolve stable release
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          runuser -u builder -- python .github/scripts/update-release.py --self-test
          runuser -u builder -- python .github/scripts/update-release.py
      - name: Open or refresh update PR
        id: pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: automation/update-release
          delete-branch: true
          add-paths: |
            PKGBUILD
            .SRCINFO
          commit-message: Update anarlog-bin stable release
          title: Update anarlog-bin stable release
          body: |
            Updates the version and checksums from upstream's packaging recipe. Changes to build instructions stop automation for manual review.

            Build and package tests start automatically. A successful build merges this PR automatically; the merged recipe is then rebuilt and published to AUR. A failed check prevents automatic merging and publication.
      # Explicit dispatch starts tests for bot commits without a PAT or approval click.
      - name: Start automatic build and tests
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$PR_SHA" -f state=pending -f context='Package build and tests' -f description='Automatic package checks starting'
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref automation/update-release
